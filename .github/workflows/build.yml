name: Build Flotime Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'TAG VERSION'
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: '-VERSION CODE'
        required: true
        default: '01'
        type: string
      notes:
        description: 'CHANGELOG'
        required: false
        default: '     '
        type: string
      publish_release:
        description: 'Publish otomatis ke tab Releases?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > app/release.jks
          
      - name: Set APK Version in Gradle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CLEAN_VER="${VERSION#v}"
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${CLEAN_VER}\"/" app/build.gradle.kts
          echo "Updated versionName to ${CLEAN_VER}"
          
      - name: Build Signed Release APK
        env:
          BASE_VERSION: ${{ inputs.version }}
          BUILD_NUM: ${{ inputs.build_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          DATE_SHORT=$(TZ="Asia/Jakarta" date +"%y%m%d")
          export APP_VERSION_NAME="${BASE_VERSION#v}"
          export APP_VERSION_CODE="${DATE_SHORT}${BUILD_NUM}"
          echo "Building versionName=${APP_VERSION_NAME} | versionCode=${APP_VERSION_CODE}"
          gradle clean assembleRelease --stacktrace

      - name: Clean up Release Keystore
        if: always()
        run: rm -f app/release.jks

      - name: Prepare Renamed APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" "Flotime-${VERSION}.apk"
          echo "=== APK SIZE ==="
          ls -lh "Flotime-${VERSION}.apk"
          echo "=== TOP 10 LARGEST FILES IN APK ==="
          unzip -l "Flotime-${VERSION}.apk" | sort -k1 -n -r | head -n 12

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Flotime-${{ inputs.version }}
          path: Flotime-${{ inputs.version }}.apk

      - name: Publish to GitHub Releases
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          APK_FILE="Flotime-${VERSION}.apk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$APK_FILE" --clobber
            gh release edit "$VERSION" --title "Flotime $VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" "$APK_FILE" \
              --title "Flotime $VERSION" \
              --notes "$NOTES" \
              --latest
          fi
